name: Terraform, one project

# Plans or applies the stages of one Google Cloud project, called by
# terraform.yml once per project. With `changed` false the job is skipped
# rather than not called: a skipped job reports its check (the ruleset's
# required "plan-<project> / plan"), and an apply skipped this way never
# asks its environment's reviewer.
#
# What it needs to act in the project comes from the file the project's
# bootstrap wrote, <project>/bootstrap/ci.env (identifiers only); a
# project without that file hasn't been bootstrapped and is skipped. Both
# accounts are reached through Workload Identity Federation: no key is
# stored anywhere.
on:
  workflow_call:
    inputs:
      project:
        description: The project's folder, e.g. pokechamps/prod
        type: string
        required: true
      stages:
        description: Its stages, space-separated, in the order they are applied (paths under the project's folder)
        type: string
        required: true
      validate_only:
        description: Stages a plan run only validates (space-separated)
        type: string
        default: ""
      mode:
        description: plan (as the read-only account) or apply (as Terraform's account, from main only)
        type: string
        required: true
      environment:
        description: The GitHub environment an apply waits in for its reviewer
        type: string
        default: ""
      changed:
        description: Whether anything this project reads changed (terraform.yml's `changes`); false skips the job, which still reports its check
        type: boolean
        default: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.11.4"
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: inputs.mode == 'plan' && inputs.changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the projects' identifiers
        id: ci
        run: .github/ci-env.sh "${{ inputs.project }}"
      - uses: hashicorp/setup-terraform@v3
        if: steps.ci.outputs.bootstrapped == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        if: steps.ci.outputs.bootstrapped == 'true'
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_PLAN_SERVICE_ACCOUNT }}
      # gcloud, to see whether a stage has a state yet.
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.ci.outputs.bootstrapped == 'true'
      # The plan stays in this run's log; it is not posted on the pull
      # request. -lock=false: the plan account can't write the state's lock.
      # A stage with no state yet (a new one) is validated only: Terraform's
      # GCS backend writes a lock to create a missing state even with
      # -lock=false, which the plan account can't; its first plan is the
      # apply job's, in the run for main, which creates the state.
      - name: Plan every stage
        if: steps.ci.outputs.bootstrapped == 'true'
        env:
          STAGES: ${{ inputs.stages }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          PROJECT: ${{ inputs.project }}
          # A stage managing Cloudflare reads it (a project without one
          # leaves the secret unset): read-only for a plan.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for stage in $STAGES; do
            echo "::group::$PROJECT/$stage"
            terraform -chdir="$PROJECT/$stage" init -input=false
            terraform -chdir="$PROJECT/$stage" validate
            # only a missing state skips the plan; any other error fails the job
            if ! out=$(gcloud storage objects describe "gs://$TF_STATE_BUCKET/$stage/default.tfstate" 2>&1 > /dev/null); then
              if echo "$out" | grep -qiE "not found|404|no urls matched"; then
                echo "validated only: $stage has no state yet; its first plan is shown by the apply job, in the run for main"
                echo "::endgroup::"
                continue
              fi
              echo "$out" >&2
              exit 1
            fi
            case " $VALIDATE_ONLY " in
              *" $stage "*) echo "validated only: its plan is shown by the apply job, in the run for main" ;;
              *) terraform -chdir="$PROJECT/$stage" plan -input=false -lock=false ;;
            esac
            echo "::endgroup::"
          done

  apply:
    if: inputs.mode == 'apply' && inputs.changed
    runs-on: ubuntu-latest
    # Waits for the environment's required reviewer before it starts.
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.project }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the projects' identifiers
        id: ci
        run: .github/ci-env.sh "${{ inputs.project }}"
      - uses: hashicorp/setup-terraform@v3
        if: steps.ci.outputs.bootstrapped == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        if: steps.ci.outputs.bootstrapped == 'true'
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      # A Helm provider gets its cluster token from this plugin.
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.ci.outputs.bootstrapped == 'true'
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Apply every stage, in order
        if: steps.ci.outputs.bootstrapped == 'true'
        env:
          STAGES: ${{ inputs.stages }}
          PROJECT: ${{ inputs.project }}
          # The environment's editing token, for a stage managing Cloudflare.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for stage in $STAGES; do
            echo "::group::$PROJECT/$stage"
            terraform -chdir="$PROJECT/$stage" init -input=false
            terraform -chdir="$PROJECT/$stage" apply -input=false -auto-approve
            echo "::endgroup::"
          done
