name: Release from the changelog

# Releases the version named by the first "## X.Y.Z" heading of the
# caller's CHANGELOG.md, unless it is out already: pushes an annotated
# tag vX.Y.Z on the commit the workflow runs for and creates a GitHub
# release whose notes are that changelog section. Each half is skipped
# when it exists, so a tag pushed by hand still gets its release. A
# changelog whose newest version is already released, or that names no
# version yet, changes nothing; changes not yet released go under a
# "## Unreleased" heading.
#
# Called from a workflow that runs on pushes to the default branch, after
# its checks:
#
#   jobs:
#     release:
#       needs: checks
#       permissions:
#         contents: write
#       uses: aka-org/gcp-infra/.github/workflows/changelog-release.yml@main
on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release the changelog's newest version
        run: |
          set -euo pipefail

          version=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2 || true)
          if [ -z "$version" ]; then
            # A changelog with only "## Unreleased" so far: no version to release.
            echo "CHANGELOG.md names no version yet: nothing to release"
            exit 0
          fi
          tag="v$version"

          notes=$(mktemp)
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { on = 1; next }
            /^## / { on = 0 }
            on
          ' CHANGELOG.md > "$notes"

          # ls-remote exits 2 when the tag is not there; anything else is
          # a failure to reach the remote, which must not be read as "not
          # released".
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "tag $tag exists"
          elif [ "$rc" -ne 2 ]; then
            echo "could not read tags from origin" >&2
            exit "$rc"
          else
            echo "tagging $(git rev-parse --short HEAD) as $tag"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag exists"
          else
            echo "releasing $tag"
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
          fi
