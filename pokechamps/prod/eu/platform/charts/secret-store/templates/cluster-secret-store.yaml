# Reads Secret Manager as the operator's own identity (Workload Identity):
# no credential is configured here, and which secrets it may read is
# decided by IAM grants on each secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: {{ required "projectId is required" .Values.projectId | quote }}
